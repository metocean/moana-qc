[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moana-qc"
version = "1.0.0"
description = "Quality Control Library for Moana/Mangōpare Temperature-Depth Sensors"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MetOcean Solutions", email = "ops@metocean.co.nz"},
    {name = "Moana Project", email = "info@moanaproject.org"}
]
maintainers = [
    {name = "MetOcean Solutions", email = "ops@metocean.co.nz"}
]
keywords = ["oceanography", "quality-control", "moana", "mangopare", "temperature", "sensors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Oceanography",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "xarray>=2024.1.0",
    "dask>=2024.1.0",
    "netCDF4>=1.6.0",
    "PyYAML>=6.0",
    "gsw>=3.6.0",
    "seawater>=3.3.4",
    "pyshp>=2.3.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    # Removed unused dependencies:
    # - mandrill (not imported anywhere)
    # - glob2 (use built-in glob)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "coverage[toml]>=7.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "ipython>=8.12.0",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "coverage[toml]>=7.0",
]
stats = [
    "matplotlib>=3.8.0",
    "cartopy>=0.22.0",
    "simplekml>=1.3.6",
    "erddapy>=2.0.0",
]

[project.urls]
Homepage = "https://www.moanaproject.org"
Repository = "https://github.com/metocean/moana-qc"
Documentation = "https://github.com/metocean/moana-qc/blob/master/docs/"
Issues = "https://github.com/metocean/moana-qc/issues"
"Moana Project" = "https://www.moanaproject.org"
"ZebraTech Sensors" = "https://www.zebra-tech.co.nz/moana/"

[project.scripts]
mangopare = "moana_qc.cli:main"

[tool.setuptools]
packages = ["moana_qc"]
include-package-data = true

[tool.setuptools.package-data]
moana_qc = ["*.yml", "*.yaml", "land_mask/*.*", "THREDDS/*.yml"]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings  
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/*" = ["S101"]       # assert allowed in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["moana_qc/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=moana_qc",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]

# Coverage configuration
[tool.coverage.run]
source = ["moana_qc"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/land_mask/*",
    "*/cartopy_data/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "gsw.*",
    "seawater.*",
    "shapefile.*",
    "mandrill.*",
    "eccodes.*",
]
ignore_missing_imports = true
